services:
  db:
    image: mysql:8
    container_name: mysql-school
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: school_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-school:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school-app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://AdminUser:AdminUser@db:3306/school_db?authPlugins=caching_sha2_password"
      SESSION_SECRET: "your-super-secret-session-key-with-at-least-32-characters-long"
      NODE_ENV: "production"
    restart: unless-stopped

volumes:
  mysql-school:
