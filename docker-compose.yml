version: "3.9"

services:
  mysql-school:
    image: mysql:8.0
    container_name: mysql-school
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: school_db
      MYSQL_USER: kidslife
      MYSQL_PASSWORD: kidslife123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups:/backups   # optional: store backups on host
    networks:
      - school-net

  school-app:
    build: .
    container_name: school-app
    restart: always
    environment:
      DATABASE_URL: "mysql://kidslife:kidslife123@mysql-school:3306/school_db"
    ports:
      - "3000:3000"
    depends_on:
      - mysql-school
    networks:
      - school-net

volumes:
  mysql_data:

networks:
  school-net:
    driver: bridge
